# Weekly dependency update PRs, grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      shopify:
        patterns:
          - "@shopify/*"
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
      dev-dependencies:
        dependency-type: development
    ignore:
      # @shopify/shopify-app-react-router supports React Router 7 only
      # (peer dependency "react-router ^7.6.2" as of 4.0.x). Drop this when a
      # release of it supports React Router 8.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
