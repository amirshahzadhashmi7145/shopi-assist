# Weekly dependency update PRs, grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      shopify:
        patterns:
          - "@shopify/*"
      # A patch release of React Router (7.18.3) made every form in the admin
      # answer "400 Bad Request" behind HTTPS, and it was merged because
      # nothing tested that. `npm run smoke` now posts those forms the way a
      # browser does: run it on every pull request from this group.
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
      dev-dependencies:
        dependency-type: development
    ignore:
      # @shopify/shopify-app-react-router supports React Router 7 only
      # (peer dependency "react-router ^7.6.2" as of 4.0.x). Drop this when a
      # release of it supports React Router 8.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
