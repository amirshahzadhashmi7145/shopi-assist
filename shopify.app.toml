# Shopi Assist app configuration.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "98f591d628d95a9fcee2d432085e5bdc"
name = "Shopi Assist"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Keep this list minimal. What each scope is for:
#   read_products                          merchant assistant: product search, low-stock report
#   read_orders                            merchant assistant: recent orders; shopper order-status lookup (opt-in)
#   read_reports                           merchant assistant: ShopifyQL sales analytics (top sellers, sales summary)
#   unauthenticated_read_product_listings  storefront widget: catalog search, best sellers, product details
#   write_app_proxy                        lets the app register the /apps/shopi-assist storefront proxy
#   write_returns                          shopper return requests (opt-in); the merchant approves each one
#   write_orders                           shopper-confirmed changes to their own unshipped order (opt-in): cancel, new address
#   write_order_edits                      shopper-confirmed item changes to their own unshipped, unpaid order (opt-in)
#   write_draft_orders                     pay-on-delivery orders from the chat form (opt-in): price, create, complete
#   write_payment_terms                    marks those orders "due on fulfillment", so they are unpaid, not paid
#
# Note: linking the project to a new app (`shopify app dev --reset`) rewrites
# this file from the app's remote settings and can blank this line. If the
# assistant suddenly cannot read anything, check here first.
scopes = "read_products,read_orders,read_reports,unauthenticated_read_product_listings,write_app_proxy,write_draft_orders,write_order_edits,write_orders,write_payment_terms,write_returns"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # A product changed, which includes its stock: tells shoppers who asked to
  # hear when it is back. Handled by: /app/routes/webhooks.products.update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  # Mandatory privacy webhooks. Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

# The storefront chat widget talks to the app through this proxy:
#   https://{shop}/apps/shopi-assist/chat  ->  {app url}/proxy/chat
# Shopify signs every proxied request, which is how the server knows which shop it came from.
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "shopi-assist"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
